<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CodePlayground Pro — Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/editor/editor.main.min.css" />
    <style>
        /* ===== RESET & VARIABEL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f7fb;
            --bg-editor: #fafafa;
            --bg-preview: #ffffff;
            --bg-sidebar: #f0f2f5;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border-color: #d1d5db;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-light: #eef2ff;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 8px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --console-bg: #1e1e2e;
            --console-text: #cdd6f4;
            --console-border: #313244;
            --sidebar-width: 220px;
            --tab-height: 36px;
            --header-min-height: 56px;
            --btn-bg: #eef2f6;
            --btn-hover: #e2e8f0;
            --btn-text: #1e293b;
        }
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-editor: #1e293b;
            --bg-preview: #0f172a;
            --bg-sidebar: #1a2236;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-light: #1e293b;
            --console-bg: #0f172a;
            --console-text: #e2e8f0;
            --console-border: #334155;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --btn-text: #f1f5f9;
        }
        html,
        body {
            height: 100dvh;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }
        /* ===== HEADER ===== */
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            flex-shrink: 0;
            z-index: 10;
            min-height: var(--header-min-height);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            user-select: none;
        }
        .logo i {
            color: var(--accent);
            font-size: 22px;
        }
        .logo span {
            background: var(--accent-light);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
            font-family: var(--font);
        }
        .btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            color: #fff;
        }
        .btn i {
            font-size: 13px;
        }
        .btn-theme {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: var(--radius);
            font-size: 15px;
            cursor: pointer;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .btn-theme:hover {
            background: var(--btn-bg);
        }
        /* ===== APP ===== */
        .app {
            display: flex;
            height: calc(100dvh - var(--header-height, var(--header-min-height)));
            overflow: hidden;
        }
        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.2s, background 0.2s;
        }
        .sidebar.collapsed {
            width: 0;
            border: none;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 34px;
        }
        .sidebar-header button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .sidebar-header button:hover {
            background: var(--border-color);
        }
        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 4px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .file-item:hover {
            background: var(--border-color);
        }
        .file-item.active {
            background: var(--accent-light);
            color: var(--accent);
        }
        .file-item .file-icon {
            font-size: 14px;
            opacity: 0.7;
        }
        .file-item .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .file-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .file-item:hover .file-actions {
            opacity: 1;
        }
        .file-item .file-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            padding: 0 3px;
            border-radius: 3px;
        }
        .file-item .file-actions button:hover {
            background: var(--border-color);
        }
        .file-item .file-actions .delete-btn:hover {
            color: #ef4444;
        }
        .sidebar-footer {
            padding: 4px 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .sidebar-footer .btn {
            flex: 1;
            padding: 4px 8px;
            font-size: 12px;
            justify-content: center;
        }
        /* ===== MAIN PANEL ===== */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            transition: flex-direction 0.25s ease;
        }
        .main-panel.vertical {
            flex-direction: column;
        }
        .editor-area {
            flex: 1 1 55%;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            min-width: 200px;
        }
        .main-panel.vertical .editor-area {
            border-right: none;
            border-bottom: 1px solid var(--border-color);
            flex: 1 1 50%;
        }
        .editor-tabs-bar {
            display: flex;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            height: var(--tab-height);
            flex-shrink: 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 4px;
            gap: 2px;
            align-items: center;
        }
        .editor-tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            height: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            font-family: var(--font);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .editor-tab-btn:hover {
            color: var(--text-primary);
            background: var(--btn-bg);
        }
        .editor-tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: transparent;
        }
        .editor-tab-btn .dirty-dot {
            display: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .editor-tab-btn.dirty .dirty-dot {
            display: inline-block;
        }
        .editor-tab-btn .close-tab {
            margin-left: 4px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.15s;
            color: var(--text-secondary);
        }
        .editor-tab-btn:hover .close-tab {
            opacity: 1;
        }
        .editor-tab-btn .close-tab:hover {
            color: #ef4444;
        }
        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .editor-slot {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .editor-slot.active {
            display: block;
        }
        .preview-area {
            flex: 1 1 45%;
            display: flex;
            flex-direction: column;
            background: var(--bg-preview);
            overflow: hidden;
            min-width: 150px;
        }
        .main-panel.vertical .preview-area {
            flex: 1 1 50%;
        }
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 14px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            height: var(--tab-height);
            flex-shrink: 0;
        }
        .preview-header span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-header .preview-status {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.6;
        }
        .preview-header .preview-status.running {
            color: var(--accent);
            opacity: 1;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        .preview-frame {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-preview);
        }
        .preview-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
        .console-panel {
            background: var(--console-bg);
            border-top: 1px solid var(--console-border);
            height: 0;
            overflow: hidden;
            transition: height 0.25s ease;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .console-panel.open {
            height: 130px;
        }
        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 14px;
            background: var(--console-bg);
            border-bottom: 1px solid var(--console-border);
            flex-shrink: 0;
            color: var(--console-text);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .console-header .console-actions {
            display: flex;
            gap: 10px;
        }
        .console-header .console-actions button {
            background: none;
            border: none;
            color: var(--console-text);
            cursor: pointer;
            font-size: 12px;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .console-header .console-actions button:hover {
            opacity: 1;
        }
        .console-body {
            flex: 1;
            overflow-y: auto;
            padding: 4px 12px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--console-text);
            background: var(--console-bg);
        }
        .console-body .log-entry {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 2px 0;
        }
        .console-body .log-entry .log-level {
            font-weight: 700;
            min-width: 48px;
            color: #a6e3a1;
        }
        .console-body .log-entry .log-level.error {
            color: #f38ba8;
        }
        .console-body .log-entry .log-level.warn {
            color: #f9e2af;
        }
        .console-body .log-entry .log-level.info {
            color: #89b4fa;
        }
        .console-body .log-empty {
            color: var(--text-secondary);
            font-style: italic;
            padding: 8px 0;
        }
        .gutter {
            background: var(--border-color);
            transition: background 0.15s;
        }
        .gutter.gutter-horizontal {
            cursor: col-resize;
            width: 5px;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfxAGAgYYmwGrIIiDjrELjpo5aiZeMwF+yNnOs5KSvgAAAABJRU5ErkJggg==');
        }
        .gutter.gutter-horizontal:hover {
            background: var(--accent);
        }
        .gutter.gutter-vertical {
            cursor: row-resize;
            height: 5px;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAFCAMAAABl/6zIAAAABlBMVEUAAADMzMzI8B5+AAAAAXRSTlMAQObYZgAAABRJREFUeAFjYGBkwmJgYGBgAAAA2AABFAF5pQAAAABJRU5ErkJggg==');
        }
        .gutter.gutter-vertical:hover {
            background: var(--accent);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 24px 28px;
            max-width: 540px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .modal h2 {
            font-size: 19px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .modal .sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 18px;
        }
        .modal .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .modal .input-group input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            transition: border-color 0.15s;
        }
        .modal .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal .input-group button {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .modal .input-group button:hover {
            background: var(--accent-hover);
        }
        .modal .cdn-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 12px;
            max-height: 140px;
            overflow-y: auto;
        }
        .modal .cdn-list li {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            gap: 8px;
        }
        .modal .cdn-list li .url {
            word-break: break-all;
            flex: 1;
        }
        .modal .cdn-list li .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .modal .cdn-list li .remove-btn:hover {
            opacity: 1;
        }
        .modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .modal .modal-actions .btn-close {
            padding: 6px 18px;
            border: none;
            border-radius: var(--radius);
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }
        .modal .modal-actions .btn-close:hover {
            background: var(--btn-hover);
        }
        .settings-group {
            margin-bottom: 18px;
        }
        .settings-group h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            gap: 12px;
        }
        .settings-row label {
            font-size: 13px;
            color: var(--text-secondary);
            min-width: 90px;
        }
        .settings-row input[type="number"],
        .settings-row select {
            width: 80px;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
        }
        .settings-row input[type="range"] {
            width: 120px;
            accent-color: var(--accent);
        }
        .settings-row .range-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-row .range-wrap span {
            font-size: 12px;
            min-width: 40px;
            color: var(--text-secondary);
        }
        .theme-selector {
            display: flex;
            gap: 8px;
        }
        .theme-selector button {
            padding: 4px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .theme-selector button.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 8px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .cmd-palette {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            max-width: 92%;
            background: var(--bg-primary);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            z-index: 2000;
            display: none;
            overflow: hidden;
        }
        .cmd-palette.open {
            display: block;
        }
        .cmd-palette input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font);
            outline: none;
        }
        .cmd-palette .cmd-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 6px 0;
        }
        .cmd-palette .cmd-item {
            padding: 8px 18px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.1s;
        }
        .cmd-palette .cmd-item:hover,
        .cmd-palette .cmd-item.selected {
            background: var(--accent-light);
        }
        .cmd-palette .cmd-item i {
            width: 20px;
            color: var(--text-secondary);
        }
        .cmd-palette .cmd-item .shortcut {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--border-color);
            padding: 0 8px;
            border-radius: 4px;
        }
        @media (max-width: 820px) {
            .sidebar {
                display: none;
            }
            .main-panel {
                flex-direction: column !important;
            }
            .editor-area {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex: 1 1 50%;
            }
            .preview-area {
                flex: 1 1 50%;
            }
            .gutter.gutter-horizontal {
                display: none;
            }
            .gutter.gutter-vertical {
                display: block;
            }
            .header {
                padding: 4px 10px;
                min-height: 48px;
                gap: 4px 8px;
            }
            .logo {
                font-size: 15px;
            }
            .logo i {
                font-size: 18px;
            }
            .logo span {
                font-size: 9px;
                padding: 0 8px;

<body>

    <div class="toast" id="toast"></div>
    <input type="file" id="fileInput" accept=".html,.css,.js" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  MONACO ENVIRONMENT
            // ============================================================
            window.MonacoEnvironment = {
                getWorkerUrl: function() {
                    if (window.__codeplaygroundWorkerUrl) return window.__codeplaygroundWorkerUrl;
                    const script =
                        `
                        self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/' };
                        importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/base/worker/workerMain.js');
                    `;
                    window.__codeplaygroundWorkerUrl = URL.createObjectURL(new Blob([script], { type: 'application/javascript' }));
                    return window.__codeplaygroundWorkerUrl;
                }
            };

            // ============================================================
            //  DOM REFS
            // ============================================================
            const $ = id => document.getElementById(id);
            const qsa = (s, ctx) => (ctx || document).querySelectorAll(s);

            const previewIframe = $('previewIframe');
            const previewStatus = $('previewStatus');
            const runBtn = $('runBtn');
            const saveBtn = $('saveBtn');
            const downloadBtn = $('downloadBtn');
            const uploadBtn = $('uploadBtn');
            const formatBtn = $('formatBtn');
            const cdnBtn = $('cdnBtn');
            const cmdBtn = $('cmdBtn');
            const settingsBtn = $('settingsBtn');
            const layoutBtn = $('layoutBtn');
            const themeBtn = $('themeBtn');
            const fileInput = $('fileInput');
            const toast = $('toast');
            const mainPanel = $('mainPanel');
            const sidebar = $('sidebar');
            const fileList = $('fileList');
            const newFileBtn = $('newFileBtn');
            const renameFileBtn = $('renameFileBtn');
            const toggleSidebarBtn = $('toggleSidebarBtn');
            const editorTabsBar = $('editorTabsBar');
            const consolePanel = $('consolePanel');
            const consoleBody = $('consoleBody');
            const clearConsoleBtn = $('clearConsoleBtn');
            const toggleConsoleBtn = $('toggleConsoleBtn');
            const cdnModal = $('cdnModal');
            const cdnInput = $('cdnInput');
            const addCdnBtn = $('addCdnBtn');
            const cdnList = $('cdnList');
            const closeCdnModal = $('closeCdnModal');
            const settingsModal = $('settingsModal');
            const closeSettingsModal = $('closeSettingsModal');
            const cmdPalette = $('cmdPalette');
            const cmdInput = $('cmdInput');
            const cmdList = $('cmdList');
            const fontSizeInput = $('fontSize');
            const tabSizeInput = $('tabSize');
            const wordWrapSelect = $('wordWrap');
            const lineNumbersSelect = $('lineNumbers');
            const minimapSelect = $('minimap');
            const autoRunCheck = $('autoRun');
            const refreshDelayRange = $('refreshDelay');
            const refreshDelayValue = $('refreshDelayValue');
            const themeSelector = document.querySelector('.theme-selector');

            // ============================================================
            //  STATE
            // ============================================================
            const STORAGE_KEY = 'codeplayground_pro_data';
            const SETTINGS_KEY = 'codeplayground_pro_settings';
            const CDN_KEY = 'codeplayground_pro_cdn';
            const THEME_KEY = 'codeplayground_pro_theme';
            const LAYOUT_KEY = 'codeplayground_pro_layout';

            let settings = {
                fontSize: 14,
                tabSize: 2,
                wordWrap: 'on',
                lineNumbers: 'on',
                minimap: true,
                autoRun: true,
                refreshDelay: 350
            };
            let theme = 'light';
            let cdnUrls = [];
            let consoleEntries = [];
            let consoleOpen = false;
            let splitInstance = null;
            let layoutMode = 'horizontal';
            let toastTimer = null;
            let updateTimer = null;
            let previewSessionToken = '';
            let moduleObjectUrls = [];

            // --- VFS ---
            let files = {};
            let activeFileId = 'index.html';
            const fileOrder = ['index.html', 'style.css', 'script.js'];

            // --- Editor instances ---
            let editors = {};

            // --- Defaults ---
            const DEFAULT_HTML = `<h1>Hello, World! 👋</h1>\n<p>Edit kode di sebelah kiri untuk melihat perubahan secara langsung.</p>\n<link rel="stylesheet" href="style.css" />\n<script src="script.js"><\/script>`;
            const DEFAULT_CSS = `body {\n  font-family: 'Segoe UI', sans-serif;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  min-height: 100vh;\n  margin: 0;\n  background: #f8fafc;\n  color: #1e293b;\n}\n\nh1 {\n  color: #4f46e5;\n  font-size: 2.8rem;\n  margin-bottom: 0.4rem;\n}\n\np {\n  font-size: 1.2rem;\n  color: #475569;\n}`;
            const DEFAULT_JS =
                `// Selamat datang di CodePlayground!\nconsole.log("Hello from JavaScript!");\n\ndocument.querySelector('h1')?.addEventListener('click', () => {\n  alert('🎉 H1 diklik!');\n});`;

            // ============================================================
            //  PERSISTENCE (dengan error handling & validasi)
            // ============================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (!data || typeof data !== 'object' || !data.files || typeof data.files !== 'object') {
                        console.warn('Invalid data structure, using defaults');
                        return null;
                    }
                    for (const id of Object.keys(data.files)) {
                        const f = data.files[id];
                        if (!validateFileName(id) || !f || typeof f !== 'object' || typeof f.content !== 'string' ||
                            !['html', 'css', 'javascript'].includes(f.language)) {
                            console.warn('Invalid file entry, removing:', id);
                            delete data.files[id];
                        }
                    }
                    if (Object.keys(data.files).length === 0) return null;
                    const storedVersion = Number(data.version) || 1;
                    if (storedVersion < 3) data.migratedFromVersion = storedVersion;
                    data.version = 3;
                    return data;
                } catch (err) {
                    console.warn('Load data error:', err);
                    return null;
                }
            }

            function saveData() {
                try {
                    const payload = { files: {}, activeFileId: activeFileId, version: 3 };
                    Object.keys(files).forEach(id => {
                        const f = files[id];
                        const currentContent = getCurrentContent(f);
                        payload.files[id] = {
                            content: currentContent,
                            committedContent: typeof f.committedContent === 'string' ? f.committedContent : currentContent,
                            language: f.language,
                            dirty: isFileDirty(f),
                            legacyDirty: f.legacyDirty === true
                        };
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                    return true;
                } catch (err) {
                    console.error('Save data error:', err);
                    showToast('⚠️ Gagal menyimpan data');
                    return false;
                }
            }

            function getCurrentContent(file) {
                return file && file.model ? file.model.getValue() : (file ? file.content : '');
            }

            function isFileDirty(file) {
                return !!file && (getCurrentContent(file) !== file.committedContent || file.legacyDirty === true);
            }

            function syncFileState(file) {
                if (!file) return false;
                const currentContent = getCurrentContent(file);
                const changed = file.content !== currentContent || file.dirty !== isFileDirty(file);
                file.content = currentContent;
                file.dirty = isFileDirty(file);
                return changed;
            }

            function syncAllFileState() {
                Object.keys(files).forEach(id => syncFileState(files[id]));
            }

            function commitAllFiles() {
                syncAllFileState();
                const previousState = Object.fromEntries(Object.keys(files).map(id => [id, {
                    committedContent: files[id].committedContent,
                    legacyDirty: files[id].legacyDirty,
                    dirty: files[id].dirty
                }]));
                Object.keys(files).forEach(id => {
                    const file = files[id];
                    file.committedContent = file.content;
                    file.legacyDirty = false;
                    file.dirty = false;
                });
                if (saveData()) return true;
                Object.keys(previousState).forEach(id => Object.assign(files[id], previousState[id]));
                return false;
            }

            // ============================================================
            //  SETTINGS (dengan validasi)
            // ============================================================
            function loadSettings() {
                try {
                    const raw = localStorage.getItem(SETTINGS_KEY);
                    if (!raw) return;
                    const s = JSON.parse(raw);
                    if (s && typeof s === 'object') {
                        if (typeof s.fontSize === 'number') settings.fontSize = clampNumber(s.fontSize, 10, 28, 14);
                        if (typeof s.tabSize === 'number') settings.tabSize = clampNumber(s.tabSize, 1, 8, 2);
                        if (['off', 'on', 'wordWrapColumn', 'bounded'].includes(s.wordWrap)) settings.wordWrap = s.wordWrap;
                        if (['on', 'off', 'relative', 'interval'].includes(s.lineNumbers)) settings.lineNumbers = s
                        .lineNumbers;
                        if (typeof s.minimap === 'boolean') settings.minimap = s.minimap;
                        if (typeof s.autoRun === 'boolean') settings.autoRun = s.autoRun;
                        if (typeof s.refreshDelay === 'number') settings.refreshDelay = clampNumber(s.refreshDelay, 100, 800, 350);
                    }
                } catch (err) {
                    console.warn('Load settings error:', err);
                }
                applySettingsUI();
            }

            function saveSettings() {
                try {
                    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
                } catch (err) {
                    console.error('Save settings error:', err);
                }
                applySettingsToEditors();
            }

            function applySettingsUI() {
                settings.fontSize = clampNumber(settings.fontSize, 10, 28, 14);
                settings.tabSize = clampNumber(settings.tabSize, 1, 8, 2);
                settings.refreshDelay = clampNumber(settings.refreshDelay, 100, 800, 350);
                fontSizeInput.value = settings.fontSize;
                tabSizeInput.value = settings.tabSize;
                wordWrapSelect.value = settings.wordWrap;
                lineNumbersSelect.value = settings.lineNumbers;
                minimapSelect.value = settings.minimap ? 'true' : 'false';
                autoRunCheck.checked = settings.autoRun;
                refreshDelayRange.value = settings.refreshDelay;
                refreshDelayValue.textContent = settings.refreshDelay + 'ms';
            }

            function clampNumber(value, min, max, fallback) {
                const number = Number(value);
                return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
            }

            function applySettingsToEditors() {
                if (!editors.html) return;
                const opts = {
                    fontSize: settings.fontSize,
                    tabSize: settings.tabSize,
                    wordWrap: settings.wordWrap,
                    lineNumbers: settings.lineNumbers,
                    minimap: { enabled: settings.minimap }
                };
                Object.values(editors).forEach(ed => ed.updateOptions(opts));
            }

            // ============================================================
            //  CDN (dengan revalidasi)
            // ============================================================
            const ALLOWED_CDN_DOMAINS = [
                'cdnjs.cloudflare.com',
                'unpkg.com',
                'jsdelivr.net',
                'cdn.tailwindcss.com',
                'cdn.jsdelivr.net',
                'cdnjs.com'
            ];

            function loadCdn() {
                try {
                    const raw = localStorage.getItem(CDN_KEY);
                    if (raw) {
                        cdnUrls = JSON.parse(raw);
                        if (!Array.isArray(cdnUrls)) cdnUrls = [];
                        cdnUrls = cdnUrls.filter(u => typeof u === 'string' && validateCdnUrl(u));
                    }
                } catch (err) {
                    console.warn('Load CDN error:', err);
                    cdnUrls = [];
                }
                renderCdnList();
            }

            function validateCdnUrl(url) {
                try {
                    const u = new URL(url);
                    if (u.protocol !== 'https:') return false;
                    const host = u.hostname;
                    for (const d of ALLOWED_CDN_DOMAINS) {
                        if (host === d || host.endsWith('.' + d)) return true;
                    }
                    return false;
                } catch (_) { return false; }
            }

            function saveCdn() {
                try {
                    localStorage.setItem(CDN_KEY, JSON.stringify(cdnUrls));
                } catch (err) {
                    console.error('Save CDN error:', err);
                }
            }

            function renderCdnList() {
                cdnList.innerHTML = '';
                if (cdnUrls.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = 'Belum ada CDN.';
                    li.style.color = 'var(--text-secondary)';
                    li.style.fontStyle = 'italic';
                    cdnList.appendChild(li);
                    return;
                }
                cdnUrls.forEach((url, i) => {
                    const li = document.createElement('li');
                    const span = document.createElement('span');
                    span.className = 'url';
                    span.textContent = url;
                    const btn = document.createElement('button');
                    btn.className = 'remove-btn';
                    btn.innerHTML = '<i class="fas fa-times"></i>';
                    btn.onclick = () => { cdnUrls.splice(i, 1);
                        saveCdn();
                        renderCdnList();
                        buildPreview();
                        showToast('🗑️ CDN dihapus'); };
                    li.appendChild(span);
                    li.appendChild(btn);
                    cdnList.appendChild(li);
                });
            }

            function addCdnUrl(url) {
                url = url.trim();
                if (!url) return false;
                if (!validateCdnUrl(url)) {
                    showToast('⚠️ Domain tidak diizinkan atau URL tidak valid');
                    return false;
                }
                if (cdnUrls.includes(url)) {
                    showToast('⚠️ Sudah ada');
                    return false;
                }
                cdnUrls.push(url);
                saveCdn();
                renderCdnList();
                buildPreview();
                showToast('✅ CDN ditambahkan');
                return true;
            }

            function getExtFromUrl(url) {
                try {
                    const u = new URL(url);
                    const p = u.pathname.split('.');
                    if (p.length > 1) return p.pop().toLowerCase();
                } catch (_) { /* ignore */ }
                return null;
            }

            function normalizeFileName(name) {
                return name.trim().replace(/\\/g, '/').replace(/^\.\//, '');
            }

            function normalizeVfsPath(pathname) {
                return normalizeFileName(pathname).replace(/^\/+/, '');
            }

            function getFileDirectory(fileId) {
                const slash = normalizeVfsPath(fileId).lastIndexOf('/');
                return slash === -1 ? '' : normalizeVfsPath(fileId).slice(0, slash + 1);
            }

            function getSourceBaseHref(fileId, baseHref) {
                const origin = 'https://codeplayground.local/';
                const sourceDirectory = getFileDirectory(fileId);
                return new URL(baseHref || './', origin + sourceDirectory);
            }

            function validateFileName(name) {
                const normalized = normalizeFileName(name);
                if (!normalized || normalized.length > 128 || normalized.startsWith('/') || normalized.endsWith('/')) return false;
                if (normalized.split('/').some(part => !part || part === '.' || part === '..')) return false;
                return /^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(normalized) && /\.(html|css|js)$/i.test(normalized);
            }

            // ============================================================
            //  ESCAPE & SAFE STRINGIFY
            // ============================================================
            function escapeForHtml(str) {
                return str
                    .replace(/<\/script\b/gi, '<\\/script')
                    .replace(/<\/style\b/gi, '<\\/style');
            }

            function safeStringify(obj) {
                try {
                    return JSON.stringify(obj);
                } catch (_) {
                    return '[Circular]';
                }
            }

            // ============================================================
            //  BUILD PREVIEW — dengan full-document detection yang lebih baik
            // ============================================================
            function isFullDocument(html) {
                const withoutLeadingComments = html.replace(/^\uFEFF/, '').replace(/^(?:\s*\x3C!--[\s\S]*?-->\s*)*/, '');
                return /^(?:<!doctype\s+html\b|<html\b|<head\b|<body\b)/i.test(withoutLeadingComments.trimStart());
            }

            function getBestFile(language, preferredName) {
                const candidates = Object.keys(files).filter(id => files[id].language === language);
                if (candidates.length === 0) return null;
                const preferred = candidates.find(id => id === preferredName);
                if (preferred) return preferred;
                return candidates[0];
            }

            function getAssetFileId(url, language, baseHref, sourceFileId) {
                try {
                    const virtualOrigin = 'https://codeplayground.local/';
                    const parsed = new URL(url, sourceFileId ? getSourceBaseHref(sourceFileId, baseHref) :
                        new URL(baseHref || './', virtualOrigin));
                    if (parsed.origin !== virtualOrigin) return null;
                    const pathname = normalizeVfsPath(decodeURIComponent(parsed.pathname));
                    const exact = Object.keys(files).find(id => files[id].language === language && normalizeVfsPath(id) === pathname);
                    if (exact) return exact;
                    if (language === 'javascript' && !/\.[a-z0-9]+$/i.test(pathname)) {
                        return Object.keys(files).find(id => files[id].language === language &&
                            normalizeVfsPath(id) === pathname + '.js') || null;
                    }
                    return null;
                } catch (_) {
                    return null;
                }
            }

            function getModuleSpecifiers(content) {
                return [
                    ...content.matchAll(/(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["']([^"']+)["']/g),
                    ...content.matchAll(/\bimport\(\s*["']([^"']+)["']\s*\)/g)
                ].map(match => match[1]);
            }

            function getPreviewProject() {
                const entrypoint = getBestFile('html', 'index.html');
                const html = entrypoint ? getCurrentContent(files[entrypoint]) : '';
                return {
                    entrypoint,
                    html,
                    css: Object.keys(files).filter(id => files[id].language === 'css').sort(),
                    javascript: Object.keys(files).filter(id => files[id].language === 'javascript').sort()
                };
            }

            function isExternalReference(url) {
                return !url || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(url.trim());
            }

            function isCheckableCodeReference(reference, language) {
                const path = reference.split(/[?#]/, 1)[0];
                return language === 'css' ? /\.css$/i.test(path) : language === 'javascript' &&
                    (/\.js$/i.test(path) || !path.includes('.'));
            }

            function getDependencyGraph() {
                const graph = new Map();
                const visit = (fileId) => {
                    if (!fileId || graph.has(fileId)) return;
                    const file = files[fileId];
                    if (!file) return;
                    const dependencies = new Set();
                    graph.set(fileId, dependencies);
                    const content = getCurrentContent(file);
                    if (file.language === 'html') {
                        const doc = new DOMParser().parseFromString(content, 'text/html');
                        const baseHref = doc.querySelector('base[href]')?.getAttribute('href') || './';
                        doc.querySelectorAll('link[rel~="stylesheet"][href], script[src]').forEach(node => {
                            const reference = node.getAttribute(node.hasAttribute('href') ? 'href' : 'src');
                            const language = node.tagName.toLowerCase() === 'link' ? 'css' : 'javascript';
                            const dependency = getAssetFileId(reference, language, baseHref, fileId);
                            if (dependency) dependencies.add(dependency);
                        });
                        doc.querySelectorAll('script[type="module"]:not([src])').forEach(node => {
                            getModuleSpecifiers(node.textContent).forEach(specifier => {
                                const dependency = getAssetFileId(specifier, 'javascript', baseHref, fileId);
                                if (dependency) dependencies.add(dependency);
                            });
                        });
                    } else if (file.language === 'css') {
                        const urlPattern = /url\(\s*["']?([^"')]+)["']?\s*\)/gi;
                        const importPattern = /@import\s+(?:["']([^"']+)["']|url\(["']?([^"')]+)["']?\))/gi;
                        let match;
                        while ((match = urlPattern.exec(content))) {
                            const dependency = getAssetFileId(match[1].trim(), 'css', './', fileId);
                            if (dependency) dependencies.add(dependency);
                        }
                        while ((match = importPattern.exec(content))) {
                            const dependency = getAssetFileId(match[1] || match[2], 'css', './', fileId);
                            if (dependency) dependencies.add(dependency);
                        }
                    } else if (file.language === 'javascript') {
                        const importPattern = /(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["']([^"']+)["']/g;
                        const dynamicImportPattern = /\bimport\(\s*["']([^"']+)["']\s*\)/g;
                        let match;
                        while ((match = importPattern.exec(content))) {
                            const dependency = getAssetFileId(match[1], 'javascript', './', fileId);
                            if (dependency) dependencies.add(dependency);
                        }
                        while ((match = dynamicImportPattern.exec(content))) {
                            const dependency = getAssetFileId(match[1], 'javascript', './', fileId);
                            if (dependency) dependencies.add(dependency);
                        }
                    }
                    dependencies.forEach(visit);
                };
                const entrypoint = getBestFile('html', 'index.html');
                visit(entrypoint);
                return graph;
            }

            function findBrokenLocalReferences() {
                const broken = [];
                Object.keys(files).filter(id => files[id].language === 'html').forEach(id => {
                    const doc = new DOMParser().parseFromString(getCurrentContent(files[id]), 'text/html');
                    const baseHref = doc.querySelector('base[href]')?.getAttribute('href') || './';
                    doc.querySelectorAll('link[rel~="stylesheet"][href], script[src]').forEach(node => {
                        const attribute = node.hasAttribute('href') ? 'href' : 'src';
                        const reference = node.getAttribute(attribute);
                        const language = node.tagName.toLowerCase() === 'link' ? 'css' : 'javascript';
                        if (!isExternalReference(reference) && !getAssetFileId(reference, language, baseHref, id)) {
                            broken.push(`${id}: ${reference}`);
                        }
                    });
                });
                Object.keys(files).forEach(id => {
                    const file = files[id];
                    const content = getCurrentContent(file);
                    const references = file.language === 'javascript' ?
                        [...content.matchAll(/(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["']([^"']+)["']/g),
                            ...content.matchAll(/\bimport\(\s*["']([^"']+)["']\s*\)/g)].map(m => m[1]) :
                        file.language === 'css' ? [
                            ...content.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi),
                            ...content.matchAll(/@import\s*["']([^"']+)["']/gi)
                        ].map(m => m[1]) : [];
                    references.forEach(reference => {
                        const language = file.language === 'javascript' ? 'javascript' : 'css';
                        if (!isExternalReference(reference) && isCheckableCodeReference(reference, language) &&
                            !getAssetFileId(reference, language, './', id)) {
                            broken.push(`${id}: ${reference}`);
                        }
                    });
                });
                return broken;
            }

            function findReferencesToFile(fileId) {
                return Object.keys(files).filter(id => id !== fileId && hasSemanticReference(id, fileId));
            }

            function forEachReference(fileId, callback) {
                const file = files[fileId];
                if (!file) return;
                const content = getCurrentContent(file);
                if (file.language === 'html') {
                    const doc = new DOMParser().parseFromString(content, 'text/html');
                    const baseHref = doc.querySelector('base[href]')?.getAttribute('href') || './';
                    const pattern = /(href|src)=(?:"([^"]+)"|'([^']+)'|([^\s>]+))/gi;
                    let match;
                    while ((match = pattern.exec(content))) callback(match[2] || match[3] || match[4], baseHref, match.index, match[0], match[1]);
                } else if (file.language === 'css') {
                    const pattern = /url\(\s*(["']?)([^"')]+)\1\s*\)|@import\s+(?:(["'])([^"']+)\3|url\((["']?)([^"')]+)\5\))/gi;
                    let match;
                    while ((match = pattern.exec(content))) callback(match[2] || match[4] || match[6], './', match.index, match[0]);
                } else {
                    const pattern = /(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["']([^"']+)["']|\bimport\(\s*["']([^"']+)["']\s*\)/g;
                    let match;
                    while ((match = pattern.exec(content))) callback(match[1] || match[2], './', match.index, match[0]);
                }
            }

            function hasSemanticReference(sourceFileId, targetFileId) {
                let found = false;
                forEachReference(sourceFileId, (reference, baseHref, index, match, attributeName) => {
                    const language = getReferenceLanguage(sourceFileId, reference, attributeName);
                    if (getAssetFileId(reference, language, baseHref, sourceFileId) === targetFileId) found = true;
                });
                return found;
            }

            function getReferenceLanguage(sourceFileId, reference, attributeName) {
                if (files[sourceFileId].language !== 'html') return files[sourceFileId].language;
                if (attributeName === 'src') return 'javascript';
                if (/\.html([?#]|$)/i.test(reference)) return 'html';
                return 'css';
            }

            function rewriteReferences(oldName, newName) {
                Object.keys(files).forEach(id => {
                    const file = files[id];
                    let content = getCurrentContent(file);
                    const replacements = [];
                    forEachReference(id, (reference, baseHref, index, match, attributeName) => {
                        const language = getReferenceLanguage(id, reference, attributeName);
                        const pathOnly = reference.split(/[?#]/, 1)[0];
                        if (getAssetFileId(pathOnly, language, baseHref, id) === oldName) {
                            const newRef = reference.replace(pathOnly, newName);
                            replacements.push({ index, length: match.length, value: match.replace(reference, newRef) });
                        }
                    });
                    replacements.reverse().forEach(replacement => {
                        content = content.slice(0, replacement.index) + replacement.value +
                            content.slice(replacement.index + replacement.length);
                    });
                    if (content !== getCurrentContent(file)) file.model.setValue(content);
                });
            }

            function inlineCssImports(content, fileId, stack = new Set()) {
                if (stack.has(fileId)) return '';
                const nextStack = new Set(stack);
                nextStack.add(fileId);
                return content.replace(/@import\s+(?:["']([^"']+)["']|url\((["']?)([^"')]+)\2\))\s*;?/gi, (match, quotedPath, _, urlPath) => {
                    const path = quotedPath || urlPath;
                    const dependency = getAssetFileId(path, 'css', './', fileId);
                    if (!dependency) return match;
                    return inlineCssImports(getCurrentContent(files[dependency]), dependency, nextStack);
                });
            }

            function inlineReferencedAssets(doc, language, tagName, attributeName, baseHref, sourceFileId) {
                const referenced = new Set();
                doc.querySelectorAll(`${tagName}[${attributeName}]`).forEach(node => {
                    const fileId = getAssetFileId(node.getAttribute(attributeName), language, baseHref, sourceFileId);
                    if (!fileId) return;
                    if (referenced.has(fileId)) {
                        node.remove();
                        return;
                    }
                    referenced.add(fileId);
                    if (language === 'javascript' && node.getAttribute('type') === 'module') {
                        const moduleUrl = createModuleObjectUrl(fileId);
                        if (moduleUrl) node.setAttribute(attributeName, moduleUrl);
                        return;
                    }
                    const replacement = document.createElement(language === 'css' ? 'style' : 'script');
                    let content = getCurrentContent(files[fileId]);
                    if (language === 'css') {
                        content = inlineCssImports(content, fileId);
                    }
                    replacement.textContent = content;
                    Array.from(node.attributes).forEach(attribute => {
                        if (attribute.name !== attributeName) replacement.setAttribute(attribute.name, attribute.value);
                    });
                    node.replaceWith(replacement);
                });
                return referenced;
            }

            function createModuleObjectUrl(fileId, stack = new Set()) {
                if (moduleObjectUrls[fileId]) return moduleObjectUrls[fileId];
                if (stack.has(fileId) || !files[fileId]) return '';
                stack.add(fileId);
                let content = getCurrentContent(files[fileId]);
                content = rewriteModuleSpecifiers(content, fileId, './', stack);
                const url = URL.createObjectURL(new Blob([content], { type: 'text/javascript' }));
                moduleObjectUrls[fileId] = url;
                moduleObjectUrls.push(url);
                stack.delete(fileId);
                return url;
            }

            function rewriteModuleSpecifiers(content, sourceFileId, baseHref, stack = new Set()) {
                const replaceSpecifier = (match, specifier) => {
                    const dependency = getAssetFileId(specifier, 'javascript', baseHref, sourceFileId);
                    if (!dependency) return match;
                    const dependencyUrl = createModuleObjectUrl(dependency, new Set(stack));
                    return dependencyUrl ? match.replace(specifier, dependencyUrl) : match;
                };
                content = content.replace(/(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["']([^"']+)["']/g, replaceSpecifier);
                return content.replace(/\bimport\(\s*["']([^"']+)["']\s*\)/g, replaceSpecifier);
            }

            function rewriteInlineModuleScripts(doc, baseHref, sourceFileId) {
                doc.querySelectorAll('script[type="module"]:not([src])').forEach(node => {
                    node.textContent = rewriteModuleSpecifiers(node.textContent, sourceFileId, baseHref, new Set([sourceFileId]));
                });
            }

            function buildPreview() {
                syncAllFileState();
                moduleObjectUrls.forEach(url => { if (typeof url === 'string') URL.revokeObjectURL(url); });
                moduleObjectUrls = [];
                const project = getPreviewProject();
                const html = project.html;
                previewSessionToken = window.crypto && typeof window.crypto.randomUUID === 'function' ?
                    window.crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

                const dependencyGraph = getDependencyGraph();
                const reachable = new Set();
                const collectReachable = fileId => {
                    if (!fileId || reachable.has(fileId)) return;
                    reachable.add(fileId);
                    (dependencyGraph.get(fileId) || new Set()).forEach(collectReachable);
                };
                collectReachable(project.entrypoint);
                const reachableCss = project.css.filter(id => reachable.has(id));
                const reachableJs = project.javascript.filter(id => reachable.has(id));

                let cdnLinks = '';
                cdnUrls.forEach(url => {
                    const ext = getExtFromUrl(url);
                    if (ext === 'css') cdnLinks += `<link rel="stylesheet" href="${url}" />\n`;
                    else cdnLinks += `<script src="${url}"><\/script>\n`;
                });

                // Interceptor — diletakkan sebelum user JS
                const intercept = `
                (function(){
                    const send=(lvl,args)=>{
                        const msg=args.map(a=>{
                            if(typeof a==='object'){
                                try { return JSON.stringify(a); } catch(_){ return '[Circular]'; }
                            }
                            return String(a);
                        }).join(' ');
                        window.parent.postMessage({type:'console',token:'${previewSessionToken}',level:lvl,message:msg},'*');
                    };
                    ['log','error','warn','info'].forEach(m=>{
                        const orig=console[m];
                        console[m]=function(...args){ orig.apply(console,args); send(m,args); };
                    });
                    window.onerror=function(msg,src,line,col,err){
                        window.parent.postMessage({type:'console',token:'${previewSessionToken}',level:'error',message:'Uncaught: '+msg+' (at '+src+':'+line+')'},'*');
                        return false;
                    };
                    window.addEventListener('unhandledrejection',e=>{
                        window.parent.postMessage({type:'console',token:'${previewSessionToken}',level:'error',message:'Promise rejection: '+e.reason},'*');
                    });
                })();
                `;

                let doc;
                const isFull = isFullDocument(html);

                if (isFull) {
                    const parsedDocument = new DOMParser().parseFromString(html, 'text/html');
                    const baseHref = parsedDocument.querySelector('base[href]')?.getAttribute('href') || './';
                    const referencedCss = inlineReferencedAssets(parsedDocument, 'css', 'link[rel~="stylesheet"]', 'href', baseHref, project.entrypoint);
                    const referencedJs = inlineReferencedAssets(parsedDocument, 'javascript', 'script', 'src', baseHref, project.entrypoint);
                    rewriteInlineModuleScripts(parsedDocument, baseHref, project.entrypoint);
                    const extraCss = reachableCss.filter(id => !referencedCss.has(id))
                        .map(id => `<style data-vfs-file="${id}">${escapeForHtml(getCurrentContent(files[id]))}</style>`).join('\n');
                    const extraJs = reachableJs.filter(id => !referencedJs.has(id))
                        .filter(id => !/\b(?:import|export)\b/.test(getCurrentContent(files[id])))
                        .map(id => `<script data-vfs-file="${id}">${escapeForHtml(getCurrentContent(files[id]))}<\/script>`).join('\n');
                    const headAssets = (extraCss ? extraCss + '\n' : '') + cdnLinks;
                    const interceptorScript = `<script>${intercept}<\/script>`;
                    const head = parsedDocument.head || parsedDocument.documentElement.insertBefore(parsedDocument.createElement('head'), parsedDocument.body);
                    head.insertAdjacentHTML('afterbegin', interceptorScript + headAssets);
                    if (extraJs) {
                        const body = parsedDocument.body || parsedDocument.documentElement.appendChild(parsedDocument.createElement('body'));
                        body.insertAdjacentHTML('beforeend', extraJs);
                    }
                    doc = '<!DOCTYPE html>' + parsedDocument.documentElement.outerHTML;
                } else {
                    const parsedDocument = new DOMParser().parseFromString(html, 'text/html');
                    const baseHref = parsedDocument.querySelector('base[href]')?.getAttribute('href') || './';
                    const referencedCss = inlineReferencedAssets(parsedDocument, 'css', 'link[rel~="stylesheet"]', 'href', baseHref, project.entrypoint);
                    const referencedJs = inlineReferencedAssets(parsedDocument, 'javascript', 'script', 'src', baseHref, project.entrypoint);
                    rewriteInlineModuleScripts(parsedDocument, baseHref, project.entrypoint);
                    const extraCss = reachableCss.filter(id => !referencedCss.has(id))
                        .map(id => `<style data-vfs-file="${id}">${escapeForHtml(getCurrentContent(files[id]))}</style>`).join('\n');
                    const extraJs = reachableJs.filter(id => !referencedJs.has(id))
                        .filter(id => !/\b(?:import|export)\b/.test(getCurrentContent(files[id])))
                        .map(id => `<script data-vfs-file="${id}">${escapeForHtml(getCurrentContent(files[id]))}<\/script>`).join('\n');
                    doc =
                        `<!DOCTYPE html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><script>${intercept}<\/script>${cdnLinks}${extraCss}</head><body>${parsedDocument.body.innerHTML}${extraJs}</body></html>`;
                }

                previewIframe.srcdoc = '';
                previewIframe.srcdoc = doc;
                setPreviewStatus('live');
            }

            // ============================================================
            //  DOWNLOAD PROJECT (ZIP)
            // ============================================================
            function downloadProject() {
                if (typeof JSZip === 'undefined') {
                    showToast('⚠️ Library JSZip tidak dimuat');
                    return;
                }
                syncAllFileState();
                const brokenReferences = findBrokenLocalReferences();
                if (brokenReferences.length > 0) {
                    showToast('⚠️ ZIP dibatalkan: referensi lokal tidak valid');
                    console.warn('Broken local references:', brokenReferences);
                    return;
                }
                const zip = new JSZip();
                let hasHtml = false;
                Object.keys(files).forEach(id => {
                    const f = files[id];
                    const content = f.model ? f.model.getValue() : f.content;
                    zip.file(id, content);
                    if (f.language === 'html') hasHtml = true;
                });
                if (!hasHtml) {
                    zip.file('index.html', '<h1>Project</h1>');
                }
                zip.generateAsync({ type: 'blob' }).then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `codeplayground-project-${Date.now()}.zip`;
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast('📦 Project diunduh sebagai ZIP');
                }).catch(err => {
                    console.error('Zip error:', err);
                    showToast('⚠️ Gagal membuat ZIP');
                });
            }

            // ============================================================
            //  PREVIEW STATUS
            // ============================================================
            function setPreviewStatus(state) {
                if (state === 'running') {
                    previewStatus.textContent = '● running';
                    previewStatus.className = 'preview-status running';
                } else {
                    previewStatus.textContent = '● live';
                    previewStatus.className = 'preview-status';
                }
            }

            function scheduleUpdate() {
                if (!settings.autoRun) return;
                if (updateTimer) clearTimeout(updateTimer);
                updateTimer = setTimeout(() => { buildPreview();
                    updateTimer = null; }, settings.refreshDelay);
            }

            // ============================================================
            //  CONSOLE — dengan origin validation yang baik
            // ============================================================
            function addConsoleEntry(level, message) {
                consoleEntries.push({ level, message });
                if (consoleEntries.length > 300) consoleEntries.shift();
                renderConsole();
                if (!consoleOpen) openConsole();
            }

            function renderConsole() {
                consoleBody.innerHTML = '';
                if (consoleEntries.length === 0) {
                    consoleBody.innerHTML = '<div class="log-empty">⟡ Konsol siap</div>';
                    return;
                }
                consoleEntries.forEach(e => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    const lvl = document.createElement('span');
                    lvl.className = 'log-level';
                    if (e.level === 'error') lvl.classList.add('error');
                    else if (e.level === 'warn') lvl.classList.add('warn');
                    else if (e.level === 'info') lvl.classList.add('info');
                    lvl.textContent = e.level.toUpperCase();
                    const msg = document.createElement('span');
                    msg.className = 'log-message';
                    msg.textContent = e.message;
                    div.appendChild(lvl);
                    div.appendChild(msg);
                    consoleBody.appendChild(div);
                });
                consoleBody.scrollTop = consoleBody.scrollHeight;
            }

            function clearConsole() { consoleEntries = [];
                renderConsole(); }

            function openConsole() {
                consoleOpen = true;
                consolePanel.classList.add('open');
                toggleConsoleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            }

            function closeConsole() {
                consoleOpen = false;
                consolePanel.classList.remove('open');
                toggleConsoleBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            }

            function toggleConsole() { consoleOpen ? closeConsole() : openConsole(); }

            window.addEventListener('message', e => {
                const data = e.data;
                if (e.source !== previewIframe.contentWindow || !data || data.type !== 'console' ||
                    data.token !== previewSessionToken || !['log', 'error', 'warn', 'info'].includes(data.level) ||
                    typeof data.message !== 'string') return;
                addConsoleEntry(data.level, data.message);
            });

            // ============================================================
            //  FILES UI
            // ============================================================
            function renderFileList() {
                fileList.innerHTML = '';
                const order = Object.keys(files).sort((a, b) => {
                    const ia = fileOrder.indexOf(a),
                        ib = fileOrder.indexOf(b);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.localeCompare(b);
                });
                order.forEach(id => {
                    const f = files[id];
                    const div = document.createElement('div');
                    div.className = 'file-item' + (id === activeFileId ? ' active' : '');
                    div.dataset.fileId = id;
                    const icon = document.createElement('span');
                    icon.className = 'file-icon';
                    if (f.language === 'html') icon.innerHTML = '<i class="fab fa-html5" style="color:#e34f26;"></i>';
                    else if (f.language === 'css') icon.innerHTML = '<i class="fab fa-css3-alt" style="color:#2965f1;"></i>';
                    else if (f.language === 'javascript') icon.innerHTML =
                        '<i class="fab fa-js" style="color:#f7df1e;"></i>';
                    else icon.innerHTML = '<i class="fas fa-file"></i>';
                    const name = document.createElement('span');
                    name.className = 'file-name';
                    name.textContent = id + (f.dirty ? ' ●' : '');
                    const actions = document.createElement('span');
                    actions.className = 'file-actions';
                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.innerHTML = '<i class="fas fa-times"></i>';
                    del.title = 'Hapus file';
                    del.onclick = (e) => { e.stopPropagation();
                        deleteFile(id); };
                    actions.appendChild(del);
                    div.appendChild(icon);
                    div.appendChild(name);
                    div.appendChild(actions);
                    div.onclick = () => switchFile(id);
                    fileList.appendChild(div);
                });
            }

            function renderTabs() {
                editorTabsBar.innerHTML = '';
                const order = Object.keys(files).sort((a, b) => {
                    const ia = fileOrder.indexOf(a),
                        ib = fileOrder.indexOf(b);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.localeCompare(b);
                });
                order.forEach(id => {
                    const f = files[id];
                    const btn = document.createElement('button');
                    btn.className = 'editor-tab-btn' + (id === activeFileId ? ' active' : '') + (f.dirty ? ' dirty' :
                    '');
                    btn.dataset.file = id;
                    const label = document.createElement('span');
                    label.textContent = id;
                    const dot = document.createElement('span');
                    dot.className = 'dirty-dot';
                    const close = document.createElement('span');
                    close.className = 'close-tab';
                    close.innerHTML = '&times;';
                    close.onclick = (e) => { e.stopPropagation();
                        deleteFile(id); };
                    btn.appendChild(label);
                    btn.appendChild(dot);
                    btn.appendChild(close);
                    btn.onclick = () => switchFile(id);
                    editorTabsBar.appendChild(btn);
                });
            }

            // ============================================================
            //  CORE: SWITCH FILE
            // ============================================================
            function switchFile(id) {
                if (!files[id]) return;
                syncAllFileState();
                activeFileId = id;
                const f = files[id];
                const lang = f.language;
                const keyMap = { html: 'html', css: 'css', javascript: 'js' };
                const editorKey = keyMap[lang] || 'html';

                const editor = editors[editorKey];
                if (editor) {
                    editor.setModel(f.model);
                    editor.focus();
                }

                const slotMap = { html: 'htmlEditorSlot', css: 'cssEditorSlot', js: 'jsEditorSlot' };
                Object.keys(slotMap).forEach(k => {
                    document.getElementById(slotMap[k]).classList.toggle('active', k === editorKey);
                });

                renderFileList();
                renderTabs();
            }

            // ============================================================
            //  FILE OPERATIONS
            // ============================================================
            function createNewFile() {
                const requestedName = prompt('Nama file (contoh: about.html, utils.js):', 'newfile.js');
                if (!requestedName) return;
                const name = normalizeFileName(requestedName);
